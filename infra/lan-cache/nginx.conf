proxy_cache_path /var/cache/nginx/signage_blobs levels=1:2 keys_zone=signage_blobs:50m max_size=20g inactive=48h use_temp_path=off;

server {
    listen 8080;
    server_name _;

    # Quantized 24h blob URLs allow >95% LAN cache hit rate across all site screens
    location /media/blobs/ {
        proxy_pass http://api.signage.internal:3000;
        proxy_cache signage_blobs;
        proxy_cache_key "$uri?$args";
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header X-LAN-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://api.signage.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
